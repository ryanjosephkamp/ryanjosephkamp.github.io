<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan Kamp • MS Computer Science @ UCincinnati</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; }
        .cyberpunk-bg { background-color: #0a0a0f; }
        .project-card { transition: all 0.3s ease; border: 1px solid #334155; }
        .project-card:hover { transform: translateY(-6px); border-color: #00f9ff; box-shadow: 0 0 20px rgba(0, 249, 255, 0.2); }
        .filter-btn.active { background-color: #00f9ff; color: #0a0a0f; font-weight: 600; }
    </style>
</head>
<body class="bg-[#0a0a0f] text-slate-200 cyberpunk-bg">
    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-[#0a0a0f]/95 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-cyan-400 to-purple-500 rounded-xl flex items-center justify-center">
                    <span class="text-[#0a0a0f] font-bold text-xl">RK</span>
                </div>
                <span class="font-semibold text-2xl tracking-tight">Ryan Kamp</span>
            </div>
            
            <div class="hidden md:flex gap-x-8 text-sm">
                <a href="#about" class="hover:text-cyan-400">About</a>
                <a href="#projects" class="hover:text-cyan-400">Projects</a>
                <a href="#writings" class="hover:text-cyan-400">Writings</a>
                <a href="#cv" class="hover:text-cyan-400">CV</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="min-h-[100dvh] flex items-center pt-16">
        <div class="max-w-5xl mx-auto px-6 text-center">
            <h1 class="text-7xl md:text-8xl font-bold tracking-tighter">RYAN KAMP</h1>
            <p class="mt-4 text-xl text-slate-300">MS Computer Science @ University of Cincinnati</p>
            
            <div class="mt-8 flex justify-center gap-4">
                <a href="#projects" class="px-8 py-3 bg-white text-black font-semibold rounded-2xl hover:bg-amber-300">Explore Projects</a>
                <a href="https://drive.google.com/file/d/1ccl2OQZWUlDNYDEpQasoxtdBYhVZ0yPa/view" target="_blank" 
                   class="px-8 py-3 border border-white/30 hover:bg-white/10 rounded-2xl">Download CV</a>
            </div>
        </div>
    </section>

    <!-- Featured Projects -->
    <section id="projects" class="max-w-7xl mx-auto px-6 py-16">
        <div class="flex justify-between items-end mb-8">
            <div>
                <div class="text-amber-400 text-sm tracking-widest">CHAPTER 02</div>
                <h2 class="text-5xl font-bold tracking-tighter">Featured Projects</h2>
            </div>
            
            <!-- Filters -->
            <div class="flex flex-wrap gap-2" id="project-filters">
                <button onclick="filterProjects('all')" class="filter-btn active px-5 py-2 text-sm font-medium rounded-3xl border border-white/20">All</button>
                <button onclick="filterProjects('genai')" class="filter-btn px-5 py-2 text-sm font-medium rounded-3xl border border-white/20">Generative AI</button>
                <button onclick="filterProjects('agentic')" class="filter-btn px-5 py-2 text-sm font-medium rounded-3xl border border-white/20">Agentic &amp; Tools</button>
                <button onclick="filterProjects('ml')" class="filter-btn px-5 py-2 text-sm font-medium rounded-3xl border border-white/20">Machine Learning</button>
                <button onclick="filterProjects('linguistics')" class="filter-btn px-5 py-2 text-sm font-medium rounded-3xl border border-white/20">Computational Linguistics</button>
                <button onclick="filterProjects('biology')" class="filter-btn px-5 py-2 text-sm font-medium rounded-3xl border border-white/20">Computational Biology</button>
            </div>
        </div>

        <div id="projects-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Projects loaded here by JavaScript -->
        </div>
    </section>

    <!-- Writings -->
    <section id="writings" class="max-w-5xl mx-auto px-6 py-16">
        <h2 class="text-4xl font-bold mb-8">Writings &amp; Blogs</h2>
        <div class="grid md:grid-cols-2 gap-6">
            <a href="https://ryanjosephkamp.github.io/resmon/" target="_blank" class="block border border-white/10 p-8 rounded-3xl hover:border-cyan-400">
                <div class="font-semibold text-2xl">resmon Blog</div>
                <div class="text-sm text-slate-400 mt-2">Literature surveillance • AI tooling</div>
            </a>
            <a href="https://ryanjosephkamp.github.io/grokedex/" target="_blank" class="block border border-white/10 p-8 rounded-3xl hover:border-purple-400">
                <div class="font-semibold text-2xl">Grokédex</div>
                <div class="text-sm text-slate-400 mt-2">Grok • xAI documentation</div>
            </a>
        </div>
    </section>

    <script>
        const projects = [
            {
                id: 1,
                title: "resmon",
                category: "agentic",
                short: "Production-grade automated literature surveillance desktop app unifying 16 scholarly repositories with optional LLM summarization.",
                description: "A sophisticated local-first desktop application that monitors open-access repositories, runs scheduled deep sweeps, and generates rich research reports.",
                tech: ["Python", "FastAPI", "Electron", "React", "SQLite"],
                links: { github: "https://github.com/ryanjosephkamp/resmon", demo: "https://ryanjosephkamp.github.io/resmon/" },
                highlight: "Flagship ongoing project"
            },
            {
                id: 2,
                title: "Image Token Study",
                category: "genai",
                short: "Large-scale empirical study measuring how token-reducing image transformations affect VLM description accuracy across 6 flagship models.",
                description: "A rigorous cross-provider study evaluating Claude, GPT, Gemini, and Grok models under controlled resolution reduction and compression.",
                tech: ["Python", "PyTorch", "BERTScore"],
                links: { github: "https://github.com/ryanjosephkamp/image_token_study" },
                highlight: "12,000 scored observations"
            },
            {
                id: 3,
                title: "SPINK7-KLK5 MD Pipeline v3",
                category: "biology",
                short: "End-to-end molecular dynamics pipeline for computing binding free energy of the SPINK7-KLK5 complex.",
                description: "Production-quality computational biophysics workflow with steered MD, umbrella sampling, and alchemical free energy perturbation.",
                tech: ["Python", "OpenMM", "AMBER"],
                links: { github: "https://github.com/ryanjosephkamp/spink7-klk5-md-pipeline-v3" },
                highlight: "33 experiments"
            },
            {
                id: 4,
                title: "Grokédex",
                category: "agentic",
                short: "Collaborative, interactive encyclopedia and user manual for Grok and the Grok app — built with Grok.",
                description: "A living documentation project featuring original insights, workflows, and structured knowledge about Grok capabilities.",
                tech: ["Markdown", "GitHub Pages"],
                links: { github: "https://github.com/ryanjosephkamp/grokedex", demo: "https://ryanjosephkamp.github.io/grokedex/" },
                highlight: "Built with Grok"
            },
            {
                id: 5,
                title: "English OpenList",
                category: "linguistics",
                short: "A comprehensive, continuously updated dictionary of 378,666+ validated English words with rich metadata.",
                description: "A living lexical resource with daily automated updates from Merriam-Webster, validation of invalid entries, and publication on Hugging Face Datasets.",
                tech: ["Python", "Merriam-Webster API", "Hugging Face Datasets", "GitHub Actions"],
                links: { 
                    github: "https://github.com/ryanjosephkamp/english-openlist", 
                    demo: "https://huggingface.co/datasets/ryanjosephkamp/english-openlist" 
                },
                highlight: "378k+ words • Daily updates"
            }
        ];

        function renderProjects(filteredProjects) {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            
            filteredProjects.forEach(project => {
                const card = document.createElement('div');
                card.className = `project-card bg-[#111118] border border-white/10 rounded-3xl p-7 cursor-pointer`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="font-semibold text-2xl">${project.title}</div>
                            <div class="text-xs text-slate-500 mt-1">${project.highlight}</div>
                        </div>
                        <span class="text-xs px-3 py-1 border border-white/10 rounded-2xl">${project.category.toUpperCase()}</span>
                    </div>
                    <p class="text-slate-300 text-sm leading-relaxed mb-6">${project.short}</p>
                    <div class="flex justify-between items-center">
                        <button onclick="event.stopImmediatePropagation(); showProjectModal(${project.id});" 
                                class="text-cyan-400 text-sm font-medium flex items-center gap-2">
                            Learn more <i class="fas fa-arrow-right text-xs"></i>
                        </button>
                        <div class="flex gap-3 text-lg">
                            \( {project.links.github ? `<a href=" \){project.links.github}" target="_blank" onclick="event.stopImmediatePropagation()"><i class="fab fa-github"></i></a>` : ''}
                            \( {project.links.demo ? `<a href=" \){project.links.demo}" target="_blank" onclick="event.stopImmediatePropagation()"><i class="fas fa-external-link-alt"></i></a>` : ''}
                        </div>
                    </div>
                `;
                card.onclick = () => showProjectModal(project.id);
                grid.appendChild(card);
            });
        }

        function filterProjects(category) {
            document.querySelectorAll('#project-filters button').forEach(btn => {
                btn.classList.remove('active', 'border-cyan-400', 'bg-cyan-400/10');
                if ((category === 'all' && btn.textContent === 'All') ||
                    (category === 'genai' && btn.textContent.includes('Generative')) ||
                    (category === 'agentic' && btn.textContent.includes('Agentic')) ||
                    (category === 'ml' && btn.textContent.includes('Machine Learning')) ||
                    (category === 'linguistics' && btn.textContent.includes('Computational Linguistics')) ||
                    (category === 'biology' && btn.textContent.includes('Computational Biology'))) {
                    btn.classList.add('active', 'border-cyan-400', 'bg-cyan-400/10');
                }
            });

            const filtered = category === 'all' ? projects : projects.filter(p => p.category === category);
            renderProjects(filtered);
        }

        function showProjectModal(id) {
            const project = projects.find(p => p.id === id);
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[100] p-6';
            modal.innerHTML = `
                <div class="max-w-2xl w-full bg-[#111118] border border-white/10 rounded-3xl p-8">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <div class="text-3xl font-bold">${project.title}</div>
                            <div class="text-cyan-400 text-sm mt-1">${project.highlight}</div>
                        </div>
                        <button onclick="this.closest('.fixed').remove()" class="text-3xl">×</button>
                    </div>
                    <p class="text-slate-300">${project.description}</p>
                    <div class="mt-6 flex flex-wrap gap-2">
                        \( {project.tech.map(t => `<span class="px-4 py-1 bg-white/5 text-xs rounded-2xl"> \){t}</span>`).join('')}
                    </div>
                    <div class="mt-8 flex gap-4">
                        \( {project.links.github ? `<a href=" \){project.links.github}" target="_blank" class="flex-1 text-center py-3 bg-white/10 rounded-2xl">View on GitHub</a>` : ''}
                        \( {project.links.demo ? `<a href=" \){project.links.demo}" target="_blank" class="flex-1 text-center py-3 bg-cyan-400 text-black font-semibold rounded-2xl">Visit Live Site</a>` : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function init() {
            const grid = document.getElementById('projects-grid');
            if (!grid) {
                console.error('projects-grid not found');
                return;
            }
            renderProjects(projects);
            
            // Set initial active button
            const allBtn = document.querySelector('#project-filters button');
            if (allBtn) allBtn.classList.add('active', 'border-cyan-400', 'bg-cyan-400/10');
            
            console.log('%c[Site] Projects loaded successfully!', 'color:#10b981');
        }

        window.onload = init;
    </script>
</body>
</html>
