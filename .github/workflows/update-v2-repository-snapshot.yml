name: Update V2 repository snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  update-v2-repository-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh V2 public repository snapshot
        run: npm run refresh:v2-repos

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- v2/repositories/data/repos.snapshot.json; then
            echo "No V2 repository snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/repositories/data/repos.snapshot.json
          git commit -m "Update V2 repository snapshot"
          git push
